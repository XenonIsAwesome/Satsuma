# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# Generated via `cargo deny init` and then tuned against this workspace's
# actual dependency tree (`cargo metadata`, ~510 crates as of writing):
# the [licenses] allow-list below is exactly the set of SPDX identifiers
# that appear anywhere in that tree (including as one side of an OR/AND
# expression), not a rubber-stamped "allow everything" list.

[graph]
# Both real CI targets (see .github/workflows/ci.yml's `backend` job) plus
# the mingw target used to type-check windows_integration.rs from Linux
# (see CLAUDE.md's Commands section) - keeps advisories/bans/licenses
# evaluated against what actually gets built, not just the host triple.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]

[advisories]
# db-path/db-urls left at their defaults (cargo's own advisory-db cache,
# the official RustSec repo) - only `yanked` is tightened from the
# generated default's "warn" to "deny".
yanked = "deny"
ignore = [
    # proc-macro-error 1.0.4: pulled in transitively (webview/gtk-rs stack,
    # not a direct dependency of this workspace) and unmaintained upstream
    # with no drop-in replacement in the crates that still depend on it.
    "RUSTSEC-2024-0370",
    # The rust-unic crates (unic-char-property/-range/-common/-ucd-ident/
    # -ucd-version) are all unmaintained upstream (see
    # https://github.com/open-i18n/rust-unic) and, like proc-macro-error
    # above, are transitive-only here - no first-party dependency on any
    # of them to swap out.
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0100",
    "RUSTSEC-2025-0098",
    # paste 1.0.15: unmaintained upstream (archived by its author, no
    # drop-in replacement adopted by the crates that still depend on it -
    # see https://github.com/dtolnay/paste), pulled in transitively via
    # rav1e (the image family's AVIF encoder, see
    # crates/satsuma-core/Cargo.toml) - not a direct dependency of this
    # workspace, same class of issue as proc-macro-error above.
    "RUSTSEC-2024-0436",
    # ttf-parser 0.25.1: unmaintained upstream (see
    # https://github.com/harfbuzz/ttf-parser/issues/217), pulled in
    # transitively via pdf-extract's lopdf dependency (the document
    # family's PDF text extraction, see crates/satsuma-core/Cargo.toml) -
    # not a direct dependency of this workspace.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "Unlicense",
    # File-level copyleft (cssparser, selectors, option-ext, dtoa-short -
    # transitive deps of tao/wry's webview integration). Doesn't require
    # this project's own code to be MPL-licensed, and Satsuma is MIT
    # already, so no conflict.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
# "deny" (the generated default) would fail on a wildcard version
# requirement found inside proc-macro-error's own transitive dependency
# tree - not something declared in this workspace's own Cargo.toml, and
# not fixable from here (see the RUSTSEC-2024-0370 ignore above for the
# same crate).
wildcards = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
